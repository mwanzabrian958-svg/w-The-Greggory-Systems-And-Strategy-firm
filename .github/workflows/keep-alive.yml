# Keep-alive pinger: the free Render tier sleeps after 15 min idle, and a wake-up
# takes 30-60s (feels like a crash). Pinging /api/health every ~14 min keeps it
# warm. Public repo = free GitHub Actions minutes. Never hard-fails on purpose.
# After the first deploy, set the SITE_URL repository variable in GitHub, or the
# fallback URL below is used.
name: keep-alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        shell: bash
        run: |
          URL="${{ vars.SITE_URL }}"
          if [ -z "$URL" ]; then URL="https://the-greggory-systems-and-strategy-firm-jz7i.onrender.com"; fi
          curl -fsS --max-time 30 "$URL/api/health" \
            && echo "pinged $URL" \
            || echo "site not reachable yet - ignoring"