# Nixpacks phase control — keeps cloud builds deterministic.
# `npm install` (not `npm ci`) tolerates lockfile drift instead of hard-failing,
# which is what killed every previous Railway deployment.
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["echo 'No frontend build needed for API service'"]
