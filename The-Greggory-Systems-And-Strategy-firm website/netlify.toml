[build]
  command = "npm run build"
  publish = "dist"

# ==========================================================================
# DEPLOYMENT CHECKLIST (this is a full-stack app!)
#
# Netlify serves only the static frontend. The Express/MySQL/MongoDB/Redis
# backend (website/server.js) must run elsewhere (Railway, Render, Fly.io,
# or a VPS). Then:
#
#   1. Deploy the backend and note its public URL.
#   2. Netlify UI -> Site configuration -> Environment variables:
#        VITE_API_BASE_URL = https://<your-backend-host>/api
#      (unset it falls back to '/api', which will NOT work on static hosting)
#   3. Trigger a redeploy so the variable is baked into the JS bundle.
#   4. On the backend, set CORS to allow this Netlify domain and set
#      FRONTEND_URL accordingly.
# ==========================================================================

# API proxy: forward same-origin /api/* to the live Railway backend.
[[redirects]]
  from = "/api/*"
  to = "https://greggory-api-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[build.environment]
  NODE_VERSION = "20"
