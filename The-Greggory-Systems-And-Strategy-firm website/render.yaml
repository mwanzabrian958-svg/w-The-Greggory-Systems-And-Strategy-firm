# Render Blueprint — The Greggory Systems And Strategy Firm website
#
# Single-origin deployment: this one Node service serves BOTH the API and the
# built React app (dist/). Provisioning it from this file (instead of creating
# the service manually) guarantees the DB_SSL variable is set, which the cloud
# MySQL connection requires — a manually created service can silently miss it.
#
# On first boot:
#   import-if-empty seeds the cloud MySQL once (from database/*.sql), then
#   sync-db-schema adds the tables the seed dump doesn't carry (currencies,
#   knowledge_base, auth_*, etc. — see database/schema-sync.json).
# Both are idempotent and exit 0 even on error, so they never block boot.
services:
  - type: web
    name: greggory-systems-strategy
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund --include=dev && npm run build
    startCommand: node scripts/import-if-empty.js && node scripts/sync-db-schema.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin the Node major (matches "engines": ">=20 <23") so Render's default
      # image drift can never break the build or runtime.
      - key: NODE_VERSION
        value: "22"
      # Free-tier build containers have 512 MB RAM. Cap the heap so the Vite
      # bundler garbage-collects before the container gets OOM-killed mid-build.
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      # --- Cloud MySQL (Aiven) — primary endpoint on Render ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: the_greggory_systems_and_strategy_firm_db_main
      # Required: managed/remote MySQL REQUIRES TLS (see server/config/dbEndpoints.js)
      - key: DB_SSL
        value: "true"
      # --- Auth secrets (set real values in the Render dashboard) ---
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Admin API key — sent as the x-admin-key header by protected admin routes
      - key: ADMIN_KEY
        sync: false
      # --- Email relay (Gmail App Password) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TO
        sync: false
      # --- Frontend URL (CORS + email links) ---
      - key: FRONTEND_URL
        sync: false
      # --- Crawler / SEO (build-time) ---
      # Baked into public/sitemap.xml + public/robots.txt (scripts/generate-sitemap.js)
      # and index.html's canonical/og:url/JSON-LD (vite-plugin-seo.js). Set it to
      # this service's real origin; if unset, seo.config.json's `siteUrl` is used.
      - key: SITE_URL
        sync: false
      # Optional analytics / search-engine ownership tokens (omit tag if unset).
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: VITE_BING_SITE_VERIFICATION
        sync: false
      # --- Optional integrations (leave unset to disable) ---
      # Google Sign-In ("Sign in with Google" on /login + /signup).
      # BOTH must hold the SAME OAuth 2.0 client id (…apps.googleusercontent.com):
      #   VITE_GOOGLE_CLIENT_ID — build-time, baked into the React bundle (the button)
      #   GOOGLE_CLIENT_ID      — runtime, verifies the token on the server
      # Set the VITE_ one BEFORE the build; changing it needs a redeploy.
      # Authorized JavaScript origins must include this service's origin.
      # If both are blank the Google button simply hides itself — the site still works.
      # Guide: GOOGLE_SIGNIN_SETUP.md
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # M-Pesa Daraja API (copy from local .env if you take payments)
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      # M-Pesa callback (public backend URL + /api/mpesa/callback)
      - key: MPESA_CALLBACK_URL
        sync: false
      # SMS / WhatsApp + company numbers (copy from local .env if you use them)
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: COMPANY_PHONE_NUMBER
        sync: false
      - key: COMPANY_WHATSAPP_NUMBER
        sync: false
      # NOTE: MONGODB_URI and REDIS_URL are intentionally omitted — the server
      # skips MongoDB when unset and falls back to in-memory rate-limit/session
      # storage without Redis. Add them later only if you actually need them.
