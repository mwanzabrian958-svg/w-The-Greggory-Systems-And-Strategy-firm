# Nginx reverse proxy — fronts the Node API on :3000.
# Install with:
#   sudo cp deploy/nginx-app.conf /etc/nginx/sites-available/greggory
#   sudo ln -sf /etc/nginx/sites-available/greggory /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Once a domain points here, run:  sudo certbot --nginx -d api.yourdomain.co.ke
# Certbot rewrites this file to add SSL automatically.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # <- replace with api.yourdomain.co.ke when DNS exists

    # Profile photos are stored as BLOBs and uploaded via multipart
    client_max_body_size 25M;

    # Basic hardening
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # M-Pesa callbacks POST compact JSON quickly; generous timeouts anyway
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
