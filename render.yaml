# ==========================================================================
# Render Blueprint — free full-stack deployment of The Greggory Systems And
# Strategy Firm.
#
# ONE service runs everything: the Express API (/api/*) AND the built React
# frontend (dist/), served from a single origin exactly like localhost dev.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. https://dashboard.render.com/blueprints -> "New Blueprint Instance"
#      -> pick this repo. Render reads this file and prompts for the
#      `sync: false` secrets below (paste them from your local .env and from
#      your free Aiven MySQL service — see docs/DEPLOYMENT-FREE-STACK.md).
#   3. Apply. First boot auto-imports database/*.sql into the empty cloud DB.
# ==========================================================================
services:
  - type: web
    name: greggory-firm
    runtime: node
    plan: free
    region: frankfurt
    rootDir: "The-Greggory-Systems-And-Strategy-firm website"
    # package-lock.json IS tracked (it pins vite + daisyUI for reproducible
    # builds), but keep `npm install` — never `npm ci` — so a drifted lockfile
    # can never hard-fail the cloud build.
    # --include=dev is REQUIRED: NODE_ENV=production (set below) makes npm skip
    # devDependencies, so vite would be missing and `npm run build` would fail
    # with "vite: not found".
    buildCommand: npm install --no-audit --no-fund --include=dev && npm run build
    # import-if-empty seeds the cloud MySQL once (from the
    # The-Greggory-Systems-And-Strategy-firm-db-main/ seed dump), then
    # sync-db-schema adds the tables the seed dump doesn't carry (currencies,
    # properties, knowledge_base, auth_*, etc. — see database/schema-sync.json).
    # Both are idempotent and exit 0 even on error, so they never block boot.
    startCommand: node scripts/import-if-empty.js && node scripts/sync-db-schema.js && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Pin the Node major (matches "engines": ">=20 <23") so Render's default
      # image drift can never break the build or runtime.
      - key: NODE_VERSION
        value: "22"
      # Free-tier build containers have 512 MB RAM. Cap Vite's heap so the
      # bundler garbage-collects before the container gets OOM-killed mid-build.
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      # ---- Cloud MySQL (Aiven free tier) ----
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        # `sync: false` on purpose. A hardcoded `value:` here OVERRIDES whatever
        # is entered in the Render dashboard, and this one was pinned to the old
        # local XAMPP database name, which does not exist on the cloud host —
        # every request then failed with ER_BAD_DB_ERROR while the dashboard
        # showed a perfectly good value. Set the name in the dashboard instead.
        sync: false
      # ---- Auth / sessions (copy from local .env) ----
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ADMIN_CODE
        sync: false
      - key: SESSION_SECRET
        sync: false
      # NOTE: there is deliberately no ADMIN_KEY here any more. The x-admin-key
      # guard (backend/middleware/auth.js) was deleted; admin routes verify the
      # Bearer session token instead (backend/middleware/adminSession.js).
      # Declaring it with sync:false would keep the dashboard row alive and
      # advertise a second, weaker admin door that nothing reads.
      # ---- Public URLs (set after first deploy) ----
      # LIVE origin as of 2026-09-30:
      #   https://w-the-greggory-systems-and-strategy-firm-1vf9.onrender.com
      # Copy the exact origin from the service's Environment page — the suffix is
      # assigned per service, and the previous hosts here (`…-jz7i`, `…-vik4`,
      # `greggory-firm-rtl3`) are all deleted/suspended: pasting them produces a
      # 404 CORS origin and an M-Pesa callback that fires into nothing.
      - key: FRONTEND_URL
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      # ---- Crawler / SEO (build-time) ----
      # SITE_URL is baked into public/sitemap.xml, public/robots.txt (via
      # scripts/generate-sitemap.js) and into index.html's canonical/og:url/
      # JSON-LD (via vite-plugin-seo.js).
      # It is OPTIONAL: both SEO consumers fall through to Render's own
      # RENDER_EXTERNAL_URL, so a blank value now publishes this service's real
      # origin. (It used to fall through to seo.config.json, which pointed at
      # http://localhost:5173 — a Blueprint deployed with this blank shipped a
      # sitemap of localhost URLs and a localhost canonical.)
      # Set it only when a custom domain fronts the service, so the canonical and
      # the sitemap name that domain instead of the onrender.com host.
      - key: SITE_URL
        sync: false
      # Google Analytics 4 + search-engine ownership tokens. All optional: an
      # unset value simply omits the corresponding tag in index.html.
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_GOOGLE_SITE_VERIFICATION
        sync: false
      - key: VITE_BING_SITE_VERIFICATION
        sync: false
      # ---- Optional integrations (copy from local .env if you use them) ----
      # Build-time Google Sign-In (baked into the React bundle). If blank,
      # the Google button simply hides itself — the site still works.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: COMPANY_PHONE_NUMBER
        sync: false
      - key: COMPANY_WHATSAPP_NUMBER
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      # NOTE: MONGODB_URI and REDIS_URL are intentionally omitted — the server
      # skips MongoDB when unset and falls back to in-memory rate-limit/session
      # storage without Redis. Add them later only if you actually need them.
